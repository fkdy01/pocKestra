# Catalogue exhaustif des flows du POC.
# `automated` signifie que chaque scénario est exécuté par pytest en mode live.
# `manual` signifie que le flow reste inventorié mais nécessite une preuve humaine
# ou un environnement absent du POC local.
flows:
  - namespace: poc.kestra.exploitation
    id: R01_consulter_execution_echec
    automation: automated
    scenarios:
      - id: echec_attendu
        inputs: {demande_id: AUTO-R01}
        expected_state: FAILED
  - namespace: poc.kestra.exploitation
    id: R02_rejouer_execution
    automation: automated
    scenarios:
      - id: premier_passage
        inputs: {demande_id: AUTO-R02}
        expected_state: SUCCESS
      - id: rejeu_identique
        inputs: {demande_id: AUTO-R02}
        expected_state: SUCCESS
  - namespace: poc.kestra.exploitation
    id: R03_rejouer_parametres_corriges
    automation: automated
    scenarios:
      - id: parametre_invalide
        inputs: {code_validation: KO}
        expected_state: FAILED
      - id: parametre_corrige
        inputs: {code_validation: OK}
        expected_state: SUCCESS
  - namespace: poc.kestra.exploitation
    id: R04_reprise_apres_worker_crash
    automation: automated
    scenarios:
      - id: crash_simule
        inputs: {simuler_crash: true}
        expected_state: FAILED
      - id: reprise_simulee
        inputs: {simuler_crash: false}
        expected_state: SUCCESS
  - namespace: poc.kestra.exploitation
    id: R05_debloquer_execution_non_traitable
    automation: automated
    scenarios:
      - id: payload_bloque
        inputs: {payload_valide: false}
        expected_state: FAILED
      - id: payload_corrige
