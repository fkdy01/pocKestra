id: I04_powershell_windows
namespace: poc.kestra.infrastructure
description: "I04 - Exécution PowerShell Windows, avec mode mock par défaut."
labels: {poc.domain: infrastructure, poc.usecase: I04}
inputs:
  - id: execution_mode
    type: SELECT
    defaults: mock
    values: [mock, real]
  - id: target
    type: STRING
    defaults: win-srv-001
tasks:
  - id: choisir_mode
    type: io.kestra.plugin.core.flow.If
    condition: "{{ inputs.execution_mode == 'real' }}"
    then:
      - id: powershell_reel
        type: io.kestra.plugin.scripts.powershell.Script
        taskRunner: {type: io.kestra.plugin.core.runner.Process}
        script: |
          Write-Output "Target={{ inputs.target }}"
          Write-Output "ComputerName=$env:COMPUTERNAME"
          Get-Service | Select-Object -First 3 | ForEach-Object { Write-Output $_.Name }
        workerGroup:
          key: windows
    else:
      - id: powershell_mock
        type: io.kestra.plugin.scripts.shell.Commands
        taskRunner: {type: io.kestra.plugin.core.runner.Process}
        commands:
          - echo "MOCK PowerShell target={{ inputs.target }}"
          - echo "ComputerName={{ inputs.target }}"
          - echo "Service=Spooler Status=Running"
