id: G07_service_account_pipeline
namespace: poc.kestra.gouvernance
description: "G07 - Service account CI/CD : vérifier le périmètre d'action d'un compte technique."
labels: {poc.domain: gouvernance, poc.usecase: G07}
inputs:
  - id: mock_base_url
    type: STRING
    defaults: http://mock-api:8080
  - id: service_account
    type: STRING
    defaults: svc-kestra-cicd
  - id: operation
    type: SELECT
    defaults: deploy_flow
    values: [deploy_flow, delete_tenant, manage_secrets]
tasks:
  - id: verifier_service_account
    type: io.kestra.plugin.core.http.Request
    uri: "{{ inputs.mock_base_url }}/governance/service-accounts/check"
    method: POST
    headers:
      Content-Type: application/json
    body: |
      {"service_account":"{{ inputs.service_account }}","operation":"{{ inputs.operation }}","execution":"{{ execution.id }}"}
  - id: bloquer_hors_perimetre
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.verifier_service_account.body contains 'DENIED' }}"
    then:
      - id: operation_refusee
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: "Service account hors périmètre pour cette opération."
    else:
      - id: operation_autorisee
        type: io.kestra.plugin.core.log.Log
        message: "Service account autorisé pour l'opération demandée."
outputs:
  - id: service_account_decision
    type: STRING
    value: "{{ outputs.verifier_service_account.body }}"
