id: F19_secrets
namespace: poc.kestra.orchestration
description: "F19 - Gestion des secrets : démontrer la référence à un secret sans l'écrire dans Git."
labels: {poc.domain: orchestration, poc.usecase: F19}
inputs:
  - id: endpoint
    type: STRING
    defaults: https://example.invalid/api
tasks:
  - id: construire_entete
    type: io.kestra.plugin.core.debug.Return
    format: "Authorization: Bearer {{ secret('POC_API_TOKEN') | default('SECRET_NON_CONFIGURE', true) }}"
  - id: consigne
    type: io.kestra.plugin.core.log.Log
    message: "Vérifier que le secret POC_API_TOKEN n'est jamais stocké en clair dans le flow."
