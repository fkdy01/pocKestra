id: F19_secrets
namespace: poc.kestra.orchestration
description: "F19 - Gestion des secrets : démontrer la référence à un secret sans l'écrire dans Git."
labels: {poc.domain: orchestration, poc.usecase: F19}
inputs:
  - id: endpoint
    type: STRING
    defaults: https://example.invalid/api
  - id: verifier_secret_configure
    type: BOOLEAN
    defaults: false
tasks:
  - id: verifier_reference
    type: io.kestra.plugin.core.flow.If
    condition: "{{ inputs.verifier_secret_configure }}"
    then:
      - id: verifier_secret_sans_afficher
        type: io.kestra.plugin.scripts.shell.Commands
        taskRunner: {type: io.kestra.plugin.core.runner.Process}
        env:
          POC_API_TOKEN: "{{ secret('POC_API_TOKEN') }}"
        commands:
          - 'test -n "$POC_API_TOKEN"'
          - echo "Référence au secret vérifiée sans afficher sa valeur."
    else:
      - id: mode_demonstration
        type: io.kestra.plugin.core.log.Log
        message: "Mode démonstration : aucun secret n'est lu."
  - id: consigne
    type: io.kestra.plugin.core.log.Log
    message: "Vérifier que le secret POC_API_TOKEN n'est jamais stocké en clair dans le flow."
